name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numpy (optional acceleration path)
        run: pip install numpy
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo end-to-end
        run: python demo.py
      - name: Synthetic benchmark
        run: python benchmark.py
      - name: Public eval smoke (LoCoMo 40Q, offline data)
        run: python public_eval.py --dataset locomo --limit 40 --budget 800 --turns 3 --episode-chars 900 --no-download --out results/ci_smoke.json
      - name: Compile check
        run: python -m compileall -q memstack
      - name: MCP tools smoke test
        run: python -m memstack.mcp_server list-tools